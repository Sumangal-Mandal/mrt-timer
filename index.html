<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MRT Cycle" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>MRT Cycle</title>
</head>
<body>

  <!-- ========== PLAYLIST / SELECT SCREEN ========== -->
  <main id="setup" class="screen active">
    <header class="setup-header">
      <div>
        <h1>MRT&nbsp;Cycle</h1>
        <p class="tagline">Pick a workout</p>
      </div>
      <button id="share-btn" class="icon-btn" type="button" disabled aria-label="Share workout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/>
          <polyline points="16 6 12 2 8 6"/>
          <line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
      </button>
    </header>

    <!-- Loading skeletons -->
    <div id="playlist-loading" class="pl-skeletons">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

    <!-- Error fetching workouts -->
    <div id="playlist-error" class="banner banner-error" hidden></div>

    <!-- Workout cards injected here -->
    <div id="playlist" hidden></div>

    <!-- Custom / paste link (collapsible) -->
    <details id="custom-section" class="collapsible">
      <summary>Use a custom workout link</summary>
      <div class="collapsible-body">
        <div class="row">
          <input id="paste-link" type="text" inputmode="url" autocomplete="off"
                 placeholder="Paste share link or workout text" />
          <button id="load-link" class="btn btn-ghost" type="button">Load</button>
        </div>
        <p id="link-status" class="hint"></p>
      </div>
    </details>

    <!-- Hidden: holds selected workout text for parser/start/share -->
    <textarea id="workout" hidden></textarea>
    <div id="parse-error" class="banner banner-error" hidden></div>

    <p class="build-tag" id="build-tag"></p>

    <!-- Sticky start button -->
    <div class="action-bar">
      <button id="start-btn" class="btn btn-primary" type="button" disabled>▶ Start workout</button>
    </div>
  </main>

  <!-- ========== TIMER SCREEN ========== -->
  <main id="timer" class="screen timer-screen">
    <div class="timer-top">
      <button id="quit-btn" class="chip" type="button">✕ End</button>
      <div class="cycle-pill">Cycle <span id="cycle-cur">1</span>/<span id="cycle-total">1</span></div>
    </div>

    <div class="phase-label" id="phase-label">GET READY</div>

    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 220 220">
        <circle class="ring-track" cx="110" cy="110" r="100" />
        <circle class="ring-progress" id="ring-progress" cx="110" cy="110" r="100" />
      </svg>
      <div class="ring-center">
        <div class="count" id="count">0</div>
        <div class="count-unit">sec</div>
      </div>
    </div>

    <div class="current-exercise" id="current-exercise">—</div>
    <div class="next-exercise">Next: <span id="next-exercise">—</span></div>

    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="timer-controls">
      <button id="prev-btn" class="ctrl" type="button" aria-label="Previous">⏮</button>
      <button id="pause-btn" class="ctrl ctrl-main" type="button" aria-label="Pause">⏸</button>
      <button id="skip-btn" class="ctrl" type="button" aria-label="Skip">⏭</button>
    </div>
  </main>

  <!-- ========== DONE SCREEN ========== -->
  <main id="done" class="screen done-screen">
    <div class="done-emoji">🎉</div>
    <h2>Workout complete!</h2>
    <p id="done-summary" class="done-summary"></p>
    <button id="done-btn" class="btn btn-primary" type="button">Back to workouts</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
